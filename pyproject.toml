[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "my-jev"
version = "0.1.0"
description = "Open-Jev candidate scoring, with resumable single-GPU research training"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==5.10.2",
  "peft==0.19.1",
  "accelerate==1.13.0",
  "huggingface-hub>=1.0,<2",
  "safetensors>=0.6,<1",
  "pyyaml>=6.0,<7",
  "tqdm>=4.67,<5",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/my_jev/_upstream", ".verification-tmp", "data", "runs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
